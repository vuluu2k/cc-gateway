# cc-gateway (dashboard + /v1 proxy) -> webcake-ai 10.1.5.200:8443
# Lives on nginx-01 at /usr/local/openresty/nginx/conf/sites/ccg-toolvn.conf.
# Cert: lua-resty-auto-ssl (port 80 ACME challenge is handled by the default server in nginx.conf).
# Replace SERVER_NAME before installing.

upstream cc_gateway {
    server 10.1.5.200:8443;
    keepalive 16;
}

server {
    listen 443 ssl;
    server_name SERVER_NAME;

    access_log off;
    error_log /dev/null crit;

    # Claude Code request bodies carry the whole conversation.
    client_max_body_size 50m;

    location / {
        proxy_pass http://cc_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_redirect off;

        # Host: install scripts and the portal build the gateway URL from it.
        # Proto: session cookies are marked Secure only when this says https.
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # /v1/messages streams SSE for minutes: no buffering, long timeouts.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    ssl_certificate_by_lua_block {
        auto_ssl:ssl_certificate()
    }

    ssl_certificate /etc/ssl/resty-auto-ssl-fallback.crt;
    ssl_certificate_key /etc/ssl/resty-auto-ssl-fallback.key;
}
